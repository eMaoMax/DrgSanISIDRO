<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <title>Restablecer Contraseña - Droguería San Isidro FCH</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Google Fonts Poppins -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../css/style.css" />
        <link rel="stylesheet" href="../css/RestablecerPassw.css"/>

    </head>

    <body>
        <main class="content_main">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="card shadow custom-card">
                            <div class="card-body px-4 py-5">
                                
                                <!-- Encabezado e Icono -->
                                <div class="text-center mb-4">
                                    <h3 class="fw-bold text-white mb-1">Nueva Contraseña</h3>
                                    <p class="text-white-50 small mb-0">Crea una clave segura para proteger tu cuenta de acceso</p>
                                </div>

                                <div id="alertContainer"></div>

                                <!-- Formulario de Cambio de Clave -->
                                <form action="#" method="POST" id="formCambiarPassword">
                                    <!-- Campo Oculto -->
                                    <input type="hidden" id="usuarioID" name="usuarioID" value="">

                                    <!-- Campo Nueva Contraseña -->
                                    <div class="mb-3">
                                        <label for="NuevoPassword" class="form-label fw-semibold text-white">Nueva Contraseña</label>
                                        <div class="input-group rounded-pill overflow-hidden border-0">
                                            <input type="password" class="form-control border-0" id="NuevoPassword" name="nuevaPassword" placeholder="••••••••" />
                                            <button class="btn btn-outline-secondary border-0 bg-white" type="button" id="toggleNuevaPassword" aria-label="Mostrar contraseña">
                                                <i class="bi bi-eye-fill text-muted"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Campo Confirmar Contraseña -->
                                    <div class="mb-4">
                                        <label for="confirmarPassword" class="form-label fw-semibold text-white">Confirmar Contraseña</label>
                                        <div class="input-group rounded-pill overflow-hidden border-0">
                                            <input type="password" class="form-control border-0" id="confirmarPassword" name="confirmarPassword" placeholder="••••••••"/>
                                            <button class="btn btn-outline-secondary border-0 bg-white" type="button" id="toggleConfirmarPassword" aria-label="Mostrar contraseña">
                                                <i class="bi bi-eye-fill text-muted"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Botón Principal -->
                                    <div class="d-grid mt-4">
                                        <button type="submit" id="btnSubmit" class="btn btn-warning btn-lg rounded-pill fw-bold">Actualizar Contraseña</button>
                                    </div>

                                    <!-- Enlace Volver -->
                                    <p class="text-center mt-4 mb-0">
                                        <a href="login.html" class="btn-recover text-decoration-none">Cancelar y salir</a>
                                    </p>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="../Js/RestablecerPassword.js"></script>
    </body>
</html>
