<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <title>Login</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="../css/style.css"/>
    </head>

    <body>
        <header>
        </header>

        <main class="content-main">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="card shadow custom-card">
                            <div class="card-body px-4 py-5">
                                <div class="text-center mb-4">
                                    <h1 class="h4 mb-1 text-white fw-bold">Bienvenido a San Isidro</h1>
                                    <p class="mb-0 text-white">Tu droguería de confianza</p>
                                </div>
                                <form id="loginForm" action="#" method="post" novalidate>
                                    <div id="alertError" class="alert alert-danger py-2 small d-none rounded-pill text-center mb-3" role="alert"></div>

                                    <div class="mb-4">
                                        <label for="email" class="form-label fw-semibold text-white">Correo electrónico</label>
                                        <input type="email" class="form-control rounded-pill" id="email" name="email" placeholder="ejemplo@correo.com" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-label fw-semibold text-white">Contraseña</label>
                                        <div class="input-group rounded-pill overflow-hidden border-0">
                                            <input type="password" class="form-control border-0" id="password" name="password" placeholder="Escribe tu contraseña" required />
                                            <button class="btn btn-outline-secondary border-0" type="button" id="togglePassword" aria-label="Mostrar contraseña">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                                                    <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8z"/>
                                                    <path d="M8 5.5A2.5 2.5 0 1 1 5.5 8 2.5 2.5 0 0 1 8 5.5z"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <!-- Contenedor donde se renderizarán las alertas dinámicas -->
                                    <div id="alertContainer"></div>

                                    <div class="d-grid mt-5 spacing-custom">
                                        <button type="submit" id="btnIngresar" class="btn btn-warning btn-lg rounded-pill fw-bold">Ingresar</button>
                                    </div>
                                </form>
                                <p class="text-center text-white mt-4 mb-0">¿Olvidaste tu contraseña?: <a href="RecuperarPassword.html" class="btn-recover text-decoration-nonefw-semibold">Recuperar contraseña</a></a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <script src="../Js/login.Js"></script>
        
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        
    </body>
</html>
