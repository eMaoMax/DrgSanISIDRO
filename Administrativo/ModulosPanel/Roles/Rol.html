<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Roles de Seguridad - Droguería San Isidro FCH</title>
        <link rel="icon" type="image/png" href="../../img/Logo.png" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
        <link rel="stylesheet" href="../Usuarios/UsuarioEstilos.css" />
    </head>
    <body>

        <header class="admin-header text-white position-relative d-flex align-items-center">
            <div class="container-fluid px-4">
                <div class="row align-items-center justify-content-between g-2">
                    <div class="col-auto">
                        <a href="../../admi.html">
                            <img src="../../img/Logo.png" alt="Droguería San Isidro FCH" class="admin-logo">
                        </a>
                    </div>
                    <div class="col text-center">
                        <h2 class="web-title mb-0">Roles de Seguridad</h2>
                        <small class="text-white-50 d-none d-sm-block">Droguería San Isidro FCH</small>
                    </div>
                    <div class="col-auto d-flex align-items-center gap-2">
                        <button id="btnThemeToggle" class="btn btn-outline-light btn-sm rounded-pill px-3">
                            <i id="themeIcon" class="bi bi-moon-stars-fill me-1"></i>
                            <span id="themeText">Oscuro</span>
                        </button>
                        <a href="../../../Login/vista/login.html" id="btnLogout" class="btn btn-light text-danger btn-sm rounded-pill px-3 fw-semibold ms-1" title="Cerrar Sesión">
                            <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <div class="sub-nav bg-body-tertiary border-bottom py-2 mb-4">
            <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
                <a href="../../admi.html" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold">
                    <i class="bi bi-arrow-left-circle-fill me-1"></i> Volver al Panel
                </a>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-semibold">
                    <i class="bi bi-person-circle me-1"></i> <span id="userName">Administrador</span>
                </span>
            </div>
        </div>

        <main class="container my-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-shield-lock text-primary me-2"></i>Gestión de Roles</h2>
                    <p class="text-body-secondary mb-0">Administra los permisos y perfiles de acceso del sistema.</p>
                </div>
                <div>
                    <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalRol" onclick="prepararCrearRol()">
                        <i class="bi bi-shield-plus me-2"></i>Nuevo Rol
                    </button>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="input-group">
                        <span class="input-group-text bg-body-tertiary"><i class="bi bi-search"></i></span>
                        <input type="text" id="txtBuscarRol" class="form-control" placeholder="Buscar rol por nombre o descripción...">
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th scope="col" class="ps-4">ID</th>
                                    <th scope="col">Nombre del Rol</th>
                                    <th scope="col" class="text-end pe-4">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaRolesBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <!-- Modal Crear/Editar Rol -->
        <div class="modal fade" id="modalRol" tabindex="-1" aria-labelledby="modalRolLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="modalRolLabel">Registrar Nuevo Rol</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="formRol">
                        <div class="modal-body">
                            <input type="hidden" id="txtRolID" value="0">
                            <div class="mb-3">
                                <label for="txtNombreRol" class="form-label fw-semibold">Nombre del Rol</label>
                                <input type="text" class="form-control" id="txtNombreRol" placeholder="Ej. Administrador, Vendedor" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Guardar Rol</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../../Js/limpiezaSession.js"></script>
        <script type="module" src="Js/Interfaz/RolUI.js"></script>
        <!-- Footer -->
        <script src="../../Js/GlobalUI.js"></script>
    </body>
</html>
