<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <title>Recuperar Contraseña -Droguería San Isidro FCH</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Google Fonts Poppins -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        
        <link rel="stylesheet" href="../css/RecuperarPassw.css"/>
        <link rel="stylesheet" href="../css/style.css"/>
        

    </head>

    <body>
        <header>
        </header>
        
       <main class="content_main">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="card shadow custom-card">
                            <div class="card-body px-4 py-5">
                                
                                <!-- Encabezado e Icono -->
                                <div class="text-center mb-4">
                                    <div class="icon-shape bg-white text-primary rounded-circle mb-3 mx-auto shadow-sm">
                                        <i class="bi bi-shield-lock-fill fs-2"></i>
                                    </div>
                                    <h3 class="fw-bold text-white mb-1">¿Olvidaste tu contraseña?</h3>
                                    <p class="text-white-50 small mb-0">Ingresa tu correo y cédula registrados para validar tu cuenta</p>
                                </div>

                                <!-- Contenedor de Alertas Dinámicas -->
                                <div id="alertContainer" class="mb-3"></div>

                                <!-- Formulario de Recuperación -->
                                <form action="#" method="POST">
                                    <!-- Campo Correo -->
                                    <div class="mb-3">
                                        <label for="email" class="form-label text-white fw-medium">Correo Electrónico</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white border-0 text-secondary"><i class="bi bi-envelope-fill"></i></span>
                                            <input type="email" class="form-control border-0 px-3" id="email" name="email" placeholder="ejemplo@correo.com" required>
                                        </div>
                                    </div>

                                    <!-- Campo Cédula -->
                                    <div class="mb-4">
                                        <label for="cedula" class="form-label text-white fw-medium">Número de Cédula</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white border-0 text-secondary"><i class="bi bi-card-heading"></i></span>
                                            <input type="text" class="form-control border-0 px-3" id="cedula" name="cedula" placeholder="Ingresa tu cédula" required>
                                        </div>
                                    </div>

                                    <!-- Botón Validar -->
                                    <div class="d-grid gap-2 mb-3">
                                        <button type="submit" id="btnValidar" class="btn btn-warning btn-lg fw-bold text-dark shadow-sm btn-custom">
                                            Validar Datos <i class="bi bi-arrow-right-circle ms-1"></i>
                                        </button>
                                    </div>

                                    <!-- Volver al Login -->
                                    <div class="text-center mt-4">
                                        <a href="login.html" class="btn-recover text-decoration-none">
                                            <i class="bi bi-arrow-left me-1"></i> Volver al inicio de sesión
                                        </a>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
        </footer>
        
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="../Js/RecuperarPassword.js"></script>
    </body>
</html>
