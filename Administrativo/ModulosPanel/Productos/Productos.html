<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Catálogo de Productos - Droguería San Isidro FCH</title>
        <link rel="icon" type="image/png" href="../../img/Logo.png" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
        <link rel="stylesheet" href="../Usuarios/UsuarioEstilos.css" />
    </head>
    <body>

        <!-- Header / Banner Azul Superior -->
        <header class="admin-header text-white position-relative d-flex align-items-center">
            <div class="container-fluid px-4">
                <div class="row align-items-center justify-content-between g-2">
                    <div class="col-auto">
                        <a href="../../admi.html">
                            <img src="../../img/Logo.png" alt="Droguería San Isidro FCH" class="admin-logo">
                        </a>
                    </div>
                    <div class="col text-center">
                        <h2 class="web-title mb-0">Catálogo de Productos</h2>
                        <small class="text-white-50 d-none d-sm-block">Droguería San Isidro FCH</small>
                    </div>
                    <div class="col-auto d-flex align-items-center gap-2">
                        <button id="btnThemeToggle" class="btn btn-outline-light btn-sm rounded-pill px-3">
                            <i id="themeIcon" class="bi bi-moon-stars-fill me-1"></i>
                            <span id="themeText">Oscuro</span>
                        </button>
                        <a href="../../../Login/vista/login.html" id="btnLogout" class="btn btn-light text-danger btn-sm rounded-pill px-3 fw-semibold ms-1" title="Cerrar Sesión">
                            <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Sub Navegación -->
        <div class="sub-nav bg-body-tertiary border-bottom py-2 mb-4">
            <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
                <a href="../../admi.html" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold">
                    <i class="bi bi-arrow-left-circle-fill me-1"></i> Volver al Panel
                </a>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-semibold">
                    <i class="bi bi-person-circle me-1"></i> <span id="userName">Administrador</span>
                </span>
            </div>
        </div>

        <!-- Contenido Principal -->
        <main class="container my-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-capsule-pill text-primary me-2"></i>Catálogo de Productos</h2>
                    <p class="text-body-secondary mb-0">Administra los medicamentos y productos registrados en la droguería.</p>
                </div>
                <div>
                    <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalProducto" onclick="prepararCrearProducto()">
                        <i class="bi bi-plus-circle me-2"></i>Nuevo Producto
                    </button>
                </div>
            </div>

            <!-- Caja de Búsqueda -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="input-group">
                        <span class="input-group-text bg-body-tertiary"><i class="bi bi-search"></i></span>
                        <input type="text" id="txtBuscarProducto" class="form-control" placeholder="Buscar por nombre, laboratorio o presentación...">
                    </div>
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th scope="col" class="ps-4">ID</th>
                                    <th scope="col">Nombre</th>
                                    <th scope="col">Laboratorio</th>
                                    <th scope="col">Presentación</th>
                                    <th scope="col">Concentración</th>
                                    <th scope="col">Precio Venta</th>
                                    <th scope="col">Venta</th>
                                    <th scope="col">Stock Total</th>
                                    <th scope="col" class="text-end pe-4">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductosBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <!-- Modal Crear/Editar Producto -->
        <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="modalProductoLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="modalProductoLabel">Registrar Nuevo Producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="formProducto">
                        <div class="modal-body">
                            <input type="hidden" id="txtProductoID" value="0">
                            
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="txtNombreProducto" class="form-label fw-semibold">Nombre del Producto *</label>
                                    <input type="text" class="form-control" id="txtNombreProducto" placeholder="Ej. Acetaminofén" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="selectLaboratorio" class="form-label fw-semibold">Laboratorio / Proveedor *</label>
                                    <select class="form-select" id="selectLaboratorio" required>
                                        <option value="">-- Seleccione Laboratorio --</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="txtPresentacion" class="form-label fw-semibold">Presentación *</label>
                                    <input type="text" class="form-control" id="txtPresentacion" placeholder="Ej. Caja x 10 Tabletas" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="txtConcentracion" class="form-label fw-semibold">Concentración</label>
                                    <input type="text" class="form-control" id="txtConcentracion" placeholder="Ej. 500 mg">
                                </div>
                                <div class="col-md-6">
                                    <label for="txtPrecioVenta" class="form-label fw-semibold">Precio Venta ($) *</label>
                                    <input type="number" step="0.01" min="1" class="form-control" id="txtPrecioVenta" placeholder="Ej. 5000" required>
                                </div>
                                <div class="col-md-6 d-flex align-items-center mt-4 pt-2">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="chkRequiereReceta">
                                        <label class="form-check-label fw-semibold" for="chkRequiereReceta">Requiere Receta Médica</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Guardar Producto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../../Js/limpiezaSession.js"></script>
        <script src="../../Js/GlobalUI.js"></script>
        <script type="module" src="Js/Interfaz/ProductosUI.js"></script>
    </body>
</html>
