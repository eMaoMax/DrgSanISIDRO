<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Gestión de Usuarios - Droguería San Isidro FCH</title>

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="../../img/Logo.png" />

        <!-- Bootstrap CSS v5.3.3 / Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
        
        <!-- Estilos compartidos -->
        <link rel="stylesheet" href="UsuarioEstilos.css" />
    </head>
    <body>

            <!-- Menú de Navegación -->
        <header class="admin-header text-white position-relative d-flex align-items-center">
            <div class="container-fluid px-4">
                <div class="row align-items-center justify-content-between g-2">
                    
                    <!-- Logo ajustado -->
                    <div class="col-auto">
                        <a href="../../admi.html">
                            <img src="../../img/Logo.png" alt="Droguería San Isidro FCH" class="admin-logo">
                        </a>
                    </div>

                    <!-- Título del sistema -->
                    <div class="col text-center">
                        <h2 class="web-title mb-0">Gestión de Usuarios</h2>
                        <small class="text-white-50 d-none d-sm-block">Droguería San Isidro FCH</small>
                    </div>

                    <!-- Botón Oscuro + Cerrar Sesión -->
                    <div class="col-auto d-flex align-items-center gap-2">
                        <button id="btnThemeToggle" class="btn btn-outline-light btn-sm rounded-pill px-3">
                            <i id="themeIcon" class="bi bi-moon-stars-fill me-1"></i>
                            <span id="themeText">Oscuro</span>
                        </button>
                        
                        <a href="../../../Login/vista/login.html" id="btnLogout" class="btn btn-light text-danger btn-sm rounded-pill px-3 fw-semibold ms-1" title="Cerrar Sesión">
                            <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                        </a>
                    </div>

                </div>
            </div>
        </header>

        <!-- 2. Sub-Barra Limpia de Navegación (Debajo del encabezado) -->
        <div class="sub-nav bg-body-tertiary border-bottom py-2 mb-4">
            <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
                <!-- Volver al Panel -->
                <a href="../../admi.html" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold">
                    <i class="bi bi-arrow-left-circle-fill me-1"></i> Volver al Panel
                </a>

                <!-- Usuario Activo -->
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-semibold">
                    <i class="bi bi-person-circle me-1"></i> <span id="userName">Administrador</span>
                </span>
            </div>
        </div>

            <!-- Contenido Principal -->
            <main class="container my-4">
                
                <!-- Titular y Botón de Nuevo Usuario -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                    <div>
                        <h2 class="fw-bold mb-1"><i class="bi bi-people text-primary me-2"></i>Gestión de Usuarios</h2>
                        <p class="text-body-secondary mb-0">Administra los empleados y sus roles asignados en el sistema.</p>
                    </div>
                    <div>
                        <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalUsuario" onclick="prepararCrearUsuario()">
                            <i class="bi bi-person-plus-fill me-2"></i>Nuevo Usuario
                        </button>
                    </div>
                </div>

                <!-- Barra de Búsqueda y Filtro de Rol -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-12 col-md-8">
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary"><i class="bi bi-search"></i></span>
                                    <input type="text" id="txtBuscarUsuario" class="form-control" placeholder="Buscar por nombre, correo o cédula...">
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <select id="cboFiltroRol" class="form-select">
                                    <option value="">Todos los Roles</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabla con los campos de la BD (sp_ListarUsuarios) -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th scope="col" class="ps-4">ID</th>
                                        <th scope="col">Nombre Completo</th>
                                        <th scope="col">Cédula</th>
                                        <th scope="col">Teléfono</th>
                                        <th scope="col">Correo (Email)</th>
                                        <th scope="col">Rol</th>
                                        <th class="text-center">ESTADO</th>
                                        <th scope="col" class="text-end pe-4">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaUsuariosBody">
                                    <!-- Filas generadas dinámicamente con usuarios.js -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Modal Formulario alineado con sp_RegistrarUsuario y sp_ActualizarUsuario -->
            <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" id="modalUsuarioLabel">Registrar Nuevo Usuario</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form id="formUsuario">
                            <div class="modal-body">
                                <input type="hidden" id="txtUsuarioID" value="0">

                                <div class="row g-3">
                                    <div class="col-12 col-md-6">
                                        <label for="txtNombre" class="form-label fw-semibold">Nombre</label>
                                        <input type="text" class="form-control" id="txtNombre" placeholder="Ej. Carlos" required>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="txtApellido" class="form-label fw-semibold">Apellido</label>
                                        <input type="text" class="form-control" id="txtApellido" placeholder="Ej. Pérez" required>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="txtCedula" class="form-label fw-semibold">Cédula / Documento</label>
                                        <input type="text" class="form-control" id="txtCedula" placeholder="Ej. 1012345678" required>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="txtTelefono" class="form-label fw-semibold">Teléfono</label>
                                        <input type="text" class="form-control" id="txtTelefono" placeholder="Ej. 3001234567" required>
                                    </div>
                                    <div class="col-12 col-md-12">
                                        <label for="txtEmail" class="form-label fw-semibold">Correo Electrónico</label>
                                        <input type="email" class="form-control" id="txtEmail" placeholder="ejemplo@sanisidro.com" required>
                                    </div>
                                    <div class="col-12 col-md-6" id="divPassword">
                                        <label for="txtPassword" class="form-label fw-semibold">Contraseña</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" id="txtPassword" placeholder="••••••••">
                                            <button class="btn btn-outline-secondary" type="button" id="btnTogglePassword">
                                                <i class="bi bi-eye-fill" id="iconTogglePassword"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="cboRol" class="form-label fw-semibold">Rol de Seguridad</label>
                                        <select class="form-select" id="cboRol" required>
                                            <option value="" selected disabled>Cargando roles...</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-primary rounded-pill px-4">Guardar Usuario</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

                <!-- Bootstrap JavaScript Bundle -->
                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

                <!-- Script de sesión y tema -->
                <script src="../../Js/limpiezaSession.js"></script>

                <!-- Controlador principal de la UI (Módulo) -->
                <script type="module" src="Js/Interfaz/UsuarioUI.js"></script>

                <!-- Footer -->
                <script src="../../Js/GlobalUI.js"></script>
    </body>
</html>
